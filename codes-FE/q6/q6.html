<!-- Embed a YouTube video on a webpage using the <iframe> tag.  -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Youtube Window</title>

    <style>
      .container {
        display: flex;
        justify-content: center;
      }
    </style>
    
  </head>
  <body>
    <main class="container">
      <iframe
        width="700px"
        height="500px"
        src="https://www.youtube.com/embed/SWkMYO9V_-k"
        title="mmaaAAAaah"
        frameborder="0"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          <!-- picture-in-picture;
          --> web-share;
        "
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
    </main>
  </body>
</html>
