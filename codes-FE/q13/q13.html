<!-- Implement a hover effect on a button that changes its background colour or adds a solid 
border.  -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hover Effect</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1
        class="rgb-text"
        style="
          font-family:
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            &quot;Segoe UI&quot;,
            Roboto,
            Oxygen,
            Ubuntu,
            Cantarell,
            &quot;Open Sans&quot;,
            &quot;Helvetica Neue&quot;,
            sans-serif;
        "
      >
        <i>Hover Effect</i>
      </h1>
    </header>

    <main>
      <button
        type="button"
        style="
          font-family:
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            &quot;Segoe UI&quot;,
            Roboto,
            Oxygen,
            Ubuntu,
            Cantarell,
            &quot;Open Sans&quot;,
            &quot;Helvetica Neue&quot;,
            sans-serif;
        "
      >
        <i>Hello</i>
      </button>
    </main>
  </body>
</html>
