<!-- Use HTML5 semantic tags (such as <header>, <nav>, <section>, <article>, <footer>) to 
structure and organize content on a webpage. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Semantics</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Header Section</h1>

      <nav>
        <h1>Navigation Section</h1>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contacts</a>
      </nav>
    </header>
    <hr />

    <main>
      <aside style="width: 30%">
        <article>Article Section</article>
      </aside>

      <figure style="width: 70%">
        <h1>Main Content</h1>
        <img src="assests/chicken.jpg" width="300px" />
      </figure>
    </main>
    <hr />

    <footer>
      <p>Copyright 2026</p>
    </footer>
  </body>
</html>
