<!-- Implement a hover effect on a button that changes its background colour or adds a solid 
border.  -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hover Effect</title>

    <link rel="stylesheet" href="rgb.css">

    <style>
      body {
        margin: 0;
        min-height: 100vh;
      }

      header {
        height: 100px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      main {
        min-height: calc(100vh - 100px);
        display: flex;
        justify-content: center;
        align-items: center;
      }

      button {
        height: 80px;
        width: 300px;
        border-radius: 20px;
        background-color:lavender;
        color: white;
        border: none;

        font-size: 24px;
        transition-duration: 0.4s;
        cursor: pointer;

        text-shadow: 5px 5px 10px black;
      }
      button:hover {
        background-color: linen;
        color: gray;
        /* shadow here  */
        box-shadow: 5px 10px 5px lavender;
        text-shadow: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 class="rgb-text" style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
       Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;"><i>Hover Effect</i></h1>
    </header>

    <main>
      <button type="button" style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
       Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;"><i>Hello</i></button>
    </main>
  </body>
</html>
