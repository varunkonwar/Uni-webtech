<!-- Apply different background colors to alternate rows in a table.  -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>colourful table</title>

    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <table class="container">
      <tr id="row1">
        <th>Name</th>
        <th>Age</th>
        <th>Occupation</th>
      </tr>
      <tr id="row2">
        <td>John Doe</td>
        <td>21</td>
        <td>Software Eng.</td>
      </tr>
      <tr id="row3">
        <td>Tim Cook</td>
        <td>56</td>
        <td>Apple (CEO)</td>
      </tr>
      <tr id="row4">
        <td>Varun Konwar</td>
        <td>21</td>
        <td>Cs Student</td>
      </tr>
    </table>
  </body>
</html>
