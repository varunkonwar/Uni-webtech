 <!-- Style a heading element with a custom font, colour and background. -->
  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styling Header</title>
  </head>

    <style>
        header {
            text-align: center;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            color:pink;
            background-color: dodgerblue;
        }
    </style>

  <body>
    <header>
        <h1>Beautiful Heading</h1>
    </header>
  </body>
  </html>
