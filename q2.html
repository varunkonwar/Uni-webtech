<!-- Build a navigation menu using an unordered list (<ul>) with clickable links.  -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Menu</title>

    <style>
        .nav_bar{
            display: flex;
            border: 3px solid grey, none;
            background-color: lightblue;
            padding: 7px;
            justify-content: space-evenly;
            align-items: center;
        }

        .nav_bar li{
            background-color: aliceblue;
            border: 2px orange,solid ;
            padding: 10px;
            margin: 20px;
        }
    </style>
</head>
<body>

    <h1>Navigation Menu</h1>
    <ul class="nav_bar">
        <li><a href="https://www.youtube.com" title="YouTube Platform">YouTube</a></li>
        <li><a href="https://www.google.com" title="Google">Google</a></li>
        <li><a href="https://www.amazon.in" title="Amazon India">Amazon In</a></li>
        <li><a href="https://www.geeksforgeeks.org" title="Learn">GeeksforGeeks</a></li>
    </ul>

    <span>About Website</span>
</body>
</html>
