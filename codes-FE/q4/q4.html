<!-- Create a table with multiple rows and columns to display tabular data.  -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Basic Table</title>

    <link rel="stylesheet" href="style.css">
 </head>
 <body>
    <table class="container">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Occupation</th>
        </tr>
        <tr>
            <td>John Doe</td>
            <td>21</td>
            <td>Software Eng.</td>
        </tr>
        <tr>
            <td>Tim Cook</td>
            <td>56</td>
            <td>Apple (CEO)</td>
        </tr>
        <tr>
            <td>Varun Konwar</td>
            <td>21</td>
            <td>Cs Student</td>
        </tr>
    </table>
 </body>
 </html>
